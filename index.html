<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nivel Secundaria</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
}

/* LOGO */
.logo {
    position: absolute;
    top: 40px;
    left: 50px;
    width: 110px;
}

/* TÍTULO */
h1 {
    margin-top: 70px;
    font-size: 65px;
    color: black;

    text-shadow:
        0 0 5px #4da6ff,
        0 0 10px #4da6ff,
        0 0 20px #4da6ff;
}

/* CONTENEDOR GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 40px;
    padding: 30px;
    max-width: 1200px;
    margin: auto;
}

/* TARJETAS */
.card {
    cursor: pointer;
    transition: 0.3s;
}

.card img {
    width: 100%;
    max-width: 250px;
}

/* EFECTO HOVER */
.card:hover {
    transform: scale(1.1);
    filter: drop-shadow(0 0 15px gold);
}

/* RESPONSIVE */
@media (max-width: 900px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .grid {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<!-- INSIGNIA -->
<img src="insignia.png" class="logo">

<h1>NIVEL SECUNDARIA</h1>

<div class="grid">

    <div class="card" onclick="ir('primero.html')">
        <img src="1ro.png">
    </div>

    <div class="card" onclick="ir('segundo.html')">
        <img src="2do.png">
    </div>

    <div class="card" onclick="ir('tercero.html')">
        <img src="3ro.png">
    </div>

    <div class="card" onclick="ir('cuarto.html')">
        <img src="4to.png">
    </div>

    <div class="card" onclick="ir('quinto.html')">
        <img src="5to.png">
    </div>

</div>

<script>
function ir(pagina){
    window.location.href = pagina;
}
</script>

</body>
</html>
